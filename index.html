<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predict Next Year</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0e0e1a;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 20px;
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }
    
    #main {
      border: 2px black;
      background-color: #062126;
      padding: 40px;
      border-radius: 10px;
      opacity: 92%;
    }
    
    h1 {
      font-size: 2em;
      margin-bottom: 4px;
      color: #00ffff;
      text-align: center;
    }

    p {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 0.9em;
      opacity: 0.8;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 1.2em;
      width: 200px;
      max-width: 90vw;
      border: solid 2px black;
      border-radius: 5px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 20px;
      font-size: 1.1em;
      background: #00ffff;
      color: #000;
      border: solid 1px black;
      border-radius: 5px;
      cursor: pointer;
      max-width: 90vw;
      box-sizing: border-box;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #loader {
      margin-top: 30px;
      width: 320px;
      max-width: 90vw;
      height: 20px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      display: none;
      position: relative;
    }

    #progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #00ffff, #0077ff);
      transition: width 0.05s linear;
      position: relative;
      border-radius: 8px;
    }

    #progress span {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8em;
      color: #000;
      font-weight: bold;
    }

    #message {
      margin-top: 10px;
      font-style: italic;
      height: 24px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #00ffff;
      display: none;
      color: black;
      font-size: 18px;
    }

    #result {
      margin-top: 10px;
      font-size: 1.8em;
      color: #000000;
      position: center;
      top: 100px;
      -webkit-text-stroke: 1px black;
    }

    #Celebrate {
      position: fixed;
      top: 10px;
      right: 10px;
      border: solid 3px black;
      background-color: red;
      color: black;
      font-size: 15px;
    }

    #fpsCounter {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: #00ff00;
      padding: 5px 10px;
      font-family: monospace;
      font-size: 14px;
      border-radius: 5px;
      z-index: 9999;
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<body>
  <div id="main">
    <h1>Predict Next Year!</h1>
    <p>100% accurate (mostly)</p>
    <input type="text" id="yearInput" placeholder="Enter a year..." />
    <button id="predictBtn" onclick="startPrediction()">Predict</button>
  </div>
  <button id="Celebrate" onclick="lagYourPC()">Click <s><i><b>ONCE</b></i></s></button>
  <div id="loader">
    <div id="progress"><span id="percentText">0%</span></div>
  </div>
  <div id="message"></div>
  <div id="result"></div>
  <div id="fpsCounter">FPS: 0</div>

<script>
let isPredicting = false;
const predictBtn = document.getElementById("predictBtn");

document.getElementById("yearInput").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    startPrediction();
  }
});

function startPrediction() {
  if (isPredicting) return;
  isPredicting = true;
  predictBtn.disabled = true;
  
  
  const input = document.getElementById('yearInput').value.trim();
  const resultEl = document.getElementById('result');
  const loader = document.getElementById('loader');
  const progress = document.getElementById('progress');
  const percentText = document.getElementById('percentText');
  const message = document.getElementById('message');
	loader.style.width = '320px';
  
  if (!input) {
    alert('Please enter a year!');
    isPredicting = false;
    predictBtn.disabled = false;
    return;
  }

  resultEl.textContent = '';
  loader.style.display = 'block';
  progress.style.width = '0%';
  percentText.textContent = '0%';
  message.style.display = 'none';
  message.textContent = '';

  const progressDuration = 4000 + Math.random() * 4000;
  const finalPhraseDelay = 2000 + Math.random() * 1000;

  const startTime = Date.now();
  let currentPercent = 0;

  const allPhrases = [
	"Your free trial of waiting has started...",
	"The server said ‘brb’ and never came back...",
	"Loading at the speed of school Wi-Fi...",
	"We would blame your internet, but it’s probably us...",
	"Unplugging it and plugging it back in...",
	"Please wait while we locate the problem we caused...",
	"The website is thinking really hard right now...",
	"Loading the same thing twice just to be safe...",
	"Please hold while we pretend this is normal...",
	"Accidentally using the production server as a test server...",
	"One moment, we forgot what we were doing...",
	"Training the hamsters for maximum performance...",
	"Buffering dramatic entrance...",
	"Still faster than GTA VI...",
	"Please wait while our one server fan spins harder...",
	"Running on hopes, dreams, and expired tutorials...",
	"Generating premium disappointment...",
	"Waiting for the backend to finish its nap...",
	"Fixing the issue by ignoring it...",
	"Just a sec, the server is fighting for its life...",
	"Powered by questionable decisions...",
	"Your patience has been added to the queue...",
	"Please wait while we blame DNS...",
	"Borrowing processing power from a microwave...",
	"One moment, the website is having a character arc...",
	"Yelling at the database until it works...",
	"Loading... but, like, aggressively...",
	"Downloading ram...",
	"Searching for who asked...",
	"Making absolutely sure this takes longer...",
	"My code worked 5 minutes ago, I swear...",
  ];

  const finalPhrases = [
    "Analyzing attention span...",
    "Not getting the best results...",
    "Shutting tf up..."
  ];

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function typeWriter(text, element, callback) {
    element.style.display = 'inline-block';
    element.textContent = '';
    let i = 0;

    function type() {
      if (i < text.length) {
        element.textContent += text.charAt(i);
        i++;
        setTimeout(type, 40);
      } else {
        callback && callback();
      }
    }
    type();
  }

  const phraseList = shuffleArray([...allPhrases]).slice(0, 3);
  const fullPhraseSequence = [...phraseList, ...finalPhrases];
  let phraseIndex = 0;

  const progressLoop = setInterval(() => {
    const elapsed = Date.now() - startTime;
    let percent = (elapsed / progressDuration) * 99.5;
    if (percent > 99.5) percent = 99.9;

    progress.style.width = `${percent}%`;
    percentText.textContent = `${Math.floor(percent)}%`;
  }, 50);

  function nextPhrase() {
    if (phraseIndex < fullPhraseSequence.length) {
      typeWriter(fullPhraseSequence[phraseIndex], message, () => {
        phraseIndex++;

        if (phraseIndex === 4) {
          clearInterval(progressLoop);
          progress.style.width = '99.9%';
          percentText.textContent = '99%';
        }

        setTimeout(nextPhrase, phraseIndex < 4 ? 600 : 1000);
      });
    } else {
      setTimeout(() => {
        loader.style.width = '0%';
        resultEl.textContent = `Result: ${parseInt(input) + 1}`;
	loader.style.display = 'block';
	progress.style.width = '0%';
	percentText.textContent = '0%';
	message.style.display = 'none';
	message.textContent = '';
        confetti({
          particleCount: 1500,
          spread: 1250,
          origin: { y: 0.4 }
        });

        isPredicting = false;
        predictBtn.disabled = false;
      }, finalPhraseDelay);
    }
  }
  nextPhrase();
}

/* lag button stays unchanged */
function lagYourPC() {
  setTimeout(() => {
    for (let i = 0; i < 40; i++) {
      confetti({
        particleCount: 50000,
        spread: 1250,
        origin: { x: Math.random(), y: Math.random() * 0.6 }
      });
    }
  }, 2000);
}

/* FPS counter */
let lastTime = performance.now();
let frameCount = 0;

function updateFPS() {
  const now = performance.now();
  frameCount++;
  if (now - lastTime >= 1000) {
    document.getElementById('fpsCounter').textContent = 'FPS: ' + frameCount;
    frameCount = 0;
    lastTime = now;
  }
  requestAnimationFrame(updateFPS);
}
updateFPS();

/* background animation */
let hue = 0;
function bgLoop() {
  hue++;
  document.body.style.background =
    `linear-gradient(${hue}deg,
    hsl(${hue % 360},100%,50%),
    hsl(${(hue + 120) % 360},100%,50%),
    hsl(${(hue + 240) % 360},100%,50%))`;
  requestAnimationFrame(bgLoop);
}
bgLoop();
</script>

</body>
</html>
